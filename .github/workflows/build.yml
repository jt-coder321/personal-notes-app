name: Build APK

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode the release signing key
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/release.keystore"
          test -s "$GITHUB_WORKSPACE/release.keystore"

      - name: Run formatting unit tests
        env:
          RELEASE_KEYSTORE_FILE: ${{ github.workspace }}/release.keystore
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build optimized APK
        env:
          RELEASE_KEYSTORE_FILE: ${{ github.workspace }}/release.keystore
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Compile instrumented tests
        run: ./gradlew assembleDebugAndroidTest --stacktrace

      - name: Name the APK with its version
        id: ver
        run: |
          V=$(cat VERSION | tr -d '[:space:]')
          echo "v=$V" >> "$GITHUB_OUTPUT"
          cp app/build/outputs/apk/release/app-release.apk "personal-notes-v$V.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: personal-notes-apk
          path: personal-notes-v*.apk

      - name: Publish the versioned release and update "latest"
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=${{ steps.ver.outputs.v }}
          NOTES="Version $V. Built from ${{ github.sha }}. Install over the previous version; your notes are kept."
          gh release delete "v$V" --yes --cleanup-tag || true
          gh release create "v$V" "personal-notes-v$V.apk" --title "v$V" --notes "$NOTES"
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest "personal-notes-v$V.apk" --title "Latest: v$V" --notes "$NOTES"
