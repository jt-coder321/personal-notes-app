name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build optimized APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk personal-notes.apk

      - uses: actions/upload-artifact@v4
        with:
          name: personal-notes-apk
          path: personal-notes.apk

      - name: Publish to the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest personal-notes.apk \
            --title "Latest build (#${{ github.run_number }})" \
            --notes "Built from ${{ github.sha }}. Install over the previous version; your notes are kept."
