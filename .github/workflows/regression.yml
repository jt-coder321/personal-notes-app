name: Regression tests

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Free disk space for the emulator
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift
          df -h / | tail -1

      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build the optimized app and the test apps
        env:
          # A high version number so the build installs over the older one in the upgrade test.
          GITHUB_RUN_NUMBER: 9999
        run: ./gradlew assembleRelease assembleDebug assembleDebugAndroidTest --stacktrace

      - name: Fetch the previous build for the upgrade test
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 43760329002 -n personal-notes-apk -D old || echo "previous build not available"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run on an emulator
        id: emulator
        continue-on-error: true
        timeout-minutes: 30
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disk-size: 4096M
          disable-animations: true
          script: GITHUB_RUN_NUMBER=9999 bash scripts/regression.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: regression-output
          path: regression-output

      - name: Publish results to the regression-results branch
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd regression-output || exit 0
          rm -rf test-results
          for f in logcat-*.txt; do tail -c 400000 "$f" > "$f.tail" && mv "$f.tail" "$f"; done
          git init -q -b regression-results
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -q -m "Regression results for $GITHUB_SHA"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" regression-results

      - name: Show the summary
        if: always()
        run: |
          cat regression-output/summary.txt || echo "no summary was written"
          cat regression-output/summary.txt >> "$GITHUB_STEP_SUMMARY" || true

      - name: Stop leftover processes
        if: always()
        run: |
          ./gradlew --stop || true
          adb kill-server || true
          pkill -9 -f qemu-system || true
          pkill -9 -f crashpad_handler || true

      - name: Fail if any check failed
        run: |
          test -f regression-output/summary.txt
          ! grep -q "^FAIL" regression-output/summary.txt
